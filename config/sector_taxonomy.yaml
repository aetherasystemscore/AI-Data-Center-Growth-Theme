version: "1.0.0"
effective_date: "2026-10-20"
policy_note: >
  Do not classify a company as a direct AI beneficiary solely because it belongs
  to one of these categories. Every direct exposure claim requires verified
  contract, capacity, or revenue-segment evidence.

