[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai3-platform"
version = "1.0.0"
description = "AI Infrastructure Investment Intelligence (AI3) — Research & Portfolio Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.22.0",
    "SQLAlchemy>=2.0.30",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "openpyxl>=3.1.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
